[GEOLOCATION]
name = "Geolocation"
repo = "nids-geolocation"
key_repo = "nids-geolocation-key"
release = "later"           # nids-geolocation does not exist on GitHub, only its key repo
venue = ["nrp"]
status = "stub"             # an outline, no code. Will need MaxMind GeoLite2 CSVs -- a
                            # different artifact from the .mmdb TELESCOPE reads, so it
                            # will get its own dataset directory, not an entry here.
datasets = []

[IPDATAPLANE]
name = "IP Data Plane"
repo = "nids-ip-data-plane"
key_repo = "nids-ip-data-plane-key"
release = "later"           # neither repo exists on GitHub. Delete this block once that is
                            # confirmed to be intentional rather than a rename.
venue = ["nrp"]
status = "stub"             # empty
datasets = []
