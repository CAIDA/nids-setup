# NIDS assignment registry
#
# One block per assignment, keyed by the code published in assignments.json. Holds what
# the setup tooling needs: which repos carry the assignment and its answer key, what its
# environment is, and -- crucially -- which pins it supplies for each dataset it reads.
#
# Assignments pin *placeholders*, never URLs. The path shape lives once, in
# datasets/<id>/dataset.toml; an assignment says only "period = 2026.05". That is what
# makes drift visible: BGP and TELESCOPE read the same RouteViews dataset at two
# different months, and here that is two `period` values on one dataset rather than two
# unrelated strings in two repos.
#
# Every pin below was read out of the values tables in datasets/<id>/README.md, which
# cite the notebook and line they came from. Where this file says [unverified], the fact
# is inferred rather than read from a notebook -- keep that marking.
#
# A repo may override its own block with a `nids.toml` at its root; see docs.
# Loader: scripts/nids_registry.py
#
# `venue` -- where a module is supported, decided 2026-09-09 (D15). Every module runs on
# the NRP hub; that is the universal path and the default, so a block that says nothing
# is NRP-only. A module earns "local" by meeting two conditions and only those two: its
# environment builds from wheels with no host prerequisite the tooling cannot install,
# and every dataset it reads is publicly downloadable. `validate()` enforces the second
# half, so a module cannot claim local and quietly depend on Ceph or a credential.
#
# Local is an admission, not a tier with a fixed membership -- a module joins the day it
# meets the criteria, and UCSDNT ("expanse") will never meet them because its venue is a
# different machine, not a smaller one.

schema = 1

# --- ASN ----------------------------------------------------------------------
[ASN]
name = "ASN Introduction"
repo = "nids-asn-introduction"
key_repo = "nids-asn-introduction-key"
release = "r1"        # issue #1 -- both datasets on publicdata.caida.org; the only pure-publicdata module
venue = ["local", "nrp"]    # verified end to end on a laptop 2026-09-03, 22 cells, no errors
status = "active"
check = "00-environment-check.ipynb"   # [verified 2026-09-04] named by Brad's
                            # convention, but no such file exists in nids-asn-introduction-key on any
                            # branch or commit. `verify` reports this and runs the key
                            # notebook instead. See PLAN.md phase 4c.

[ASN.environment]
# [verified] 2026-09-03: the standard library plus IPython, no %pip line. IPython comes
# from env/base.txt, so this module installs nothing of its own.
extra = []

[[ASN.datasets]]
id = "caida-as-customer-cone"
serial = "20260501"

[[ASN.datasets]]
id = "caida-as2org"

# --- BGP ----------------------------------------------------------------------
[BGP]
name = "BGP Control Plane"
repo = "nids-bgp-control-plane"
key_repo = "nids-bgp-control-plane-key"
release = "r1"        # issue #2 -- publicdata x2 plus RouteViews via OSDF
venue = ["local", "nrp"]    # verified end to end on a laptop 2026-09-03, 30 cells, no errors
status = "active"
check = "00-environment-check.ipynb"   # [verified 2026-09-04] named by Brad's
                            # convention, but no such file exists in nids-bgp-control-plane-key on any
                            # branch or commit. `verify` reports this and runs the key
                            # notebook instead. See PLAN.md phase 4c.
profile = true
memory = { guarantee = "4Gi", limit = "8Gi", verified = false }

[BGP.environment]
# [verified] from the notebook's own %pip line.
extra = ["pybgpkit-parser", "pelicanfs", "py-radix", "pandas", "matplotlib"]

[[BGP.datasets]]
id = "routeviews-bgp-rib"
collector = "route-views3"
period = "2026.05"          # BGP and TELESCOPE differ here -- see the note at the top

[[BGP.datasets]]
id = "caida-as-customer-cone"
serial = "20260501"

[[BGP.datasets]]
id = "caida-as2org"

# --- IRR ----------------------------------------------------------------------
[IRR]
name = "Registries: WHOIS, IRR & RPKI"
repo = "nids-irr-rpki-whois"
key_repo = "nids-irr-rpki-whois-key"
# The assignments page links nids-irr-rpki-whois-local; the two are variants of the same
# assignment, not a mistake. datasets/README.md carries the note.
variants = ["nids-irr-rpki-whois-local"]
release = "later"     # issue #3 -- DROPPED from v1 on reproducibility, not access: it pins 2023
                            # snapshots and no IRR archives its dumps. See nids-irr-rpki-whois-local
venue = ["nrp"]             # the pinned 2023 snapshot is re-fetchable from nowhere, so the
                            # hub copy is the only stable one
status = "active"
check = "00-environment-check.ipynb"

[IRR.environment]
# py-radix and tqdm are imported by the notebook but are NOT in image/requirements.txt,
# so a local environment built from this block is wider than the hub image. Deliberate.
extra = ["py-radix", "tqdm"]

[[IRR.datasets]]
id = "caida-irr-whois-dumps"
snapshot = "2023-03-01"     # the reachability probe; the notebook walks Jan-Jun 2023
source = "radb"

[[IRR.datasets]]
id = "routeviews-prefix2as"
year = "2023"
month = "03"
date = "20230301"

[[IRR.datasets]]
id = "ripe-rpki-roas"
ta = "afrinic"              # probe only; the notebook reads all five trust anchors
year = "2023"
month = "03"
day = "01"

# --- ITDK ---------------------------------------------------------------------
[ITDK]
name = "ITDK"
repo = "nids-itdk"
key_repo = "nids-itdk-key"
release = "later"     # issue #4 -- reads a built Postgres database that is unpublished and absent
venue = ["nrp"]             # the database is an in-namespace deployment by construction
status = "blocked"          # no Postgres instance exists anywhere yet
blocked_on = "an in-namespace Postgres deployment"
check = "00-environment-check.ipynb"

[ITDK.environment]
# From the notebook's imports; also absent from the hub image.
extra = ["sqlalchemy", "psycopg2-binary", "pycountry", "scipy", "python-dotenv"]

[ITDK.environment.key]
# The key repo additionally *builds* the database (nids-itdk-build-db.ipynb), which the
# student repo never does. [unverified] whether the builder needs anything further.
extra = []

[[ITDK.datasets]]
id = "itdk-postgres"

# --- DNS ----------------------------------------------------------------------
[DNS]
name = "DNS Ecosystem"
repo = "nids-dns-ecosystem"
key_repo = "nids-dns-ecosystem-key"
release = "r1"        # issue #5 -- anonymous OpenINTEL S3 and a plain HTTPS parquet
venue = ["nrp"]             # its data is public, but Spark wants a JDK 17+ (plus winutils.exe
                            # and HADOOP_HOME on Windows) and `env` cannot install any of it.
                            # A laptop with a JDK already on it will very likely work -- that
                            # is best-effort, not a supported path, and it has never been run
status = "active"
check = "00-environment-check.ipynb"
profile = true
memory = { guarantee = "8Gi", limit = "12Gi", verified = false }
spark = true                # the only assignment using Spark

[DNS.environment]
# [verified] from the notebook's %pip line and imports, 2026-09-03. Spark is listed
# explicitly: the image supplies it on the NRP hub, but the central environment must not
# assume the hub.
extra = ["pyspark", "tldextract", "dnspython", "matplotlib", "numpy", "requests"]

[[DNS.datasets]]
id = "openintel-fdns"
source = "se"               # the graded source; the probe uses source=gov
year = "2024"
month = "01"
day = "15"

[[DNS.datasets]]
id = "anycast-census"

# --- TELESCOPE ----------------------------------------------------------------
[TELESCOPE]
name = "Network Telescope Traffic"
repo = "nids-telescope-traffic"
key_repo = "nids-telescope-traffic-key"
release = "later"     # issue #6 -- pcap samples unpublished; MaxMind account-gated and geo-restricted
venue = ["nrp"]             # both blockers are data-publication questions, not compute ones
status = "active"
check = "00-environment-check.ipynb"
profile = true
# [verified] the assignment README requires >=16 GB and recommends 24. The one memory
# number in this file that is not an inference.
memory = { guarantee = "16Gi", limit = "24Gi", verified = true }

[TELESCOPE.environment]
requirements = "requirements.txt"   # [verified] this repo pins its own
extra = []

[[TELESCOPE.datasets]]
id = "ucsd-nt-pcap-samples"
