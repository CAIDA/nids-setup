# Helm values for the NIDS JupyterHub (chart: jupyterhub/jupyterhub, version 3.3.7).
#
# One hub, one spawner profile per NIDS assignment. All profiles share the single
# combined image built from ../image/Dockerfile; they differ only by display name
# and memory envelope.
#
# Replace every <PLACEHOLDER>. Do NOT commit a real client secret — see hub.config
# below and keep secrets in an uncommitted override file or a Kubernetes secret.

# ---------------------------------------------------------------------------
# Authentication — CILogon OAuth (register at https://cilogon.org/oauth2/register:
#   Client Type = Confidential, Refresh Tokens = No,
#   Scopes = org.cilogon.userinfo,openid,profile,email,
#   Callback = https://<HUB_HOST>.nrp-nautilus.io/hub/oauth_callback)
# ---------------------------------------------------------------------------
hub:
  config:
    JupyterHub:
      authenticator_class: cilogon
    CILogonOAuthenticator:
      client_id: "<CILOGON_CLIENT_ID>"
      # Keep the secret OUT of version control. Prefer:
      #   helm upgrade ... -f configs/values.yaml -f secrets.values.yaml   (secrets.values.yaml gitignored)
      # or a pre-created k8s secret referenced via hub.existingSecret.
      client_secret: "<CILOGON_CLIENT_SECRET>"
      oauth_callback_url: "https://<HUB_HOST>.nrp-nautilus.io/hub/oauth_callback"
      scope:
        - org.cilogon.userinfo
        - openid
        - profile
        - email
      # REQUIRED (cluster policy): do not leave the hub open — an open hub can get
      # the namespace locked. Restrict by institution IdP and/or an explicit roster.
      # Find your IdP EntityID at https://cilogon.org/idplist.
      allowed_idps:
        "<YOUR_IDP_ENTITY_ID>":
          default: true
          allow_all: false
          allowed_domains:
            - "<your-institution.edu>"
      # Optional small-class allowlist (use instead of / in addition to domains):
      # allowed_users:
      #   - user@your-institution.edu
  # Add the NRP admins for support/debugging. If you use an IdP allowlist above,
  # INCLUDE UCSD so NRP admins and CAIDA content owners can authenticate.
  loadRoles:
    admin:
      users:
        - "<NRP_ADMIN_1>"
        - "<NRP_ADMIN_2>"

# ---------------------------------------------------------------------------
# Culling — REQUIRED by cluster policy. Deploying without it violates policy.
# timeout must be <= 21600 (6 hours). Verify after deploy with:
#   kubectl logs -n <NAMESPACE> deployment/jupyterhub -c hub | grep cull
# ---------------------------------------------------------------------------
cull:
  enabled: true
  users: false
  removeNamedServers: false
  timeout: 3600      # idle seconds before a server is culled (<= 21600)
  every: 600         # check interval, seconds
  concurrency: 10
  maxAge: 0

# ---------------------------------------------------------------------------
# Ingress / routing. NRP is migrating from Ingress to Gateway API HTTPRoute;
# during migration hosts may be exposed on ports 50080/50443
# (e.g. https://<HUB_HOST>.nrp-nautilus.io:50443). Ingress still works for now.
# ---------------------------------------------------------------------------
proxy:
  service:
    type: ClusterIP
ingress:
  enabled: true
  hosts:
    - "<HUB_HOST>.nrp-nautilus.io"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    - hosts:
        - "<HUB_HOST>.nrp-nautilus.io"
      secretName: <HUB_HOST>-tls

# ---------------------------------------------------------------------------
# Single-user servers: one shared image, one profile per assignment. Sizes marked
# (*) are estimates — right-size against real runs. Telescope's 16/24Gi is the
# only value stated by a assignment (its README/notebook: "at least 16GB, recommend 24").
# ---------------------------------------------------------------------------
singleuser:
  image:
    name: gitlab-registry.nrp-nautilus.io/caida-nids/nids-jupyterhub/nids-hub
    tag: latest
  storage:
    capacity: 10Gi
    # Optional shared, read-only dataset volume handed to every server.
    # Multi-pod use needs access mode ReadOnlyMany or ReadWriteMany.
    # extraVolumes:
    #   - name: shared-data
    #     persistentVolumeClaim:
    #       claimName: <SHARED_RWX_OR_ROX_PVC>
    # extraVolumeMounts:
    #   - name: shared-data
    #     mountPath: /home/shared
    #     readOnly: true
  profileList:
    - display_name: "NIDS - BGP Control Plane"
      description: "RouteViews RIB + CAIDA customer-cone / AS2Org (pure Python)."
      default: true
      kubespawner_override:
        mem_guarantee: 4G     # (*) estimate — holds a full RIB prefix->ASN map in RAM
        mem_limit: 8G         # (*)
    - display_name: "NIDS - Telescope Traffic (24 GB)"
      description: "Anonymized /16 telescope PCAPs; GeoLite2 + BGP enrichment."
      kubespawner_override:
        mem_guarantee: 16G    # authoritative: assignment requires >= 16 GB
        mem_limit: 24G        # recommended
    - display_name: "NIDS - DNS Ecosystem (Spark)"
      description: "OpenINTEL forward-DNS Parquet over S3A; Spark in local mode."
      kubespawner_override:
        mem_guarantee: 8G     # (*) estimate: Spark driver 4G + executor 4G + headroom
        mem_limit: 12G        # (*)
