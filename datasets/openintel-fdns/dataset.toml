schema = 1
id = "openintel-fdns"
name = "OpenINTEL forward-DNS zonefile Parquet"
used_by = ["DNS"]
produced_by = "external"
public = true
served_from = "both"
setup = "none"
time_sensitive = "yes"      # year=/month=/day= partitions
credentials = []

[access]
transport = "s3a"
endpoint = "https://object.openintel.nl"
bucket = "openintel-public"
prefix = "fdns/basis=zonefile"
template = "s3a://{bucket}/{prefix}/source={source}/year={year}/month={month}/day={day}"
pins = ["source", "year", "month", "day"]
credentials_provider = "org.apache.hadoop.fs.s3a.AnonymousAWSCredentialsProvider"

# Load-bearing S3A settings -- see README.md. Do not "optimize" the vectored.io pair.
[access.spark_conf]
"fs.s3a.impl" = "org.apache.hadoop.fs.s3a.S3AFileSystem"
"fs.s3a.endpoint" = "https://object.openintel.nl"
"fs.s3a.connection.ssl.enabled" = "true"
"fs.s3a.path.style.access" = "true"
"fs.s3a.block.size" = "64M"
"fs.s3a.readahead.range" = "4M"
"fs.s3a.vectored.io.enabled" = "false"
"parquet.hadoop.vectored.io.enabled" = "false"
"spark.sql.parquet.mergeSchema" = "false"
"spark.sql.parquet.filterPushdown" = "true"
"spark.jars.packages" = "org.apache.hadoop:hadoop-aws:3.4.0,software.amazon.awssdk:bundle:2.24.6"

[defaults]
source = "se"

[check]
section = "external"
order = 40
label = "object.openintel.nl: bucket is anonymously readable (DNS)"
# HEAD on the S3 root is 403 by design; the bucket URL is the smallest proof of
# anonymous access. A real Parquet read is the DNS assignment's own check.
kind = "http-head"
url = "https://object.openintel.nl/openintel-public"
note_suffix = "openintel-public"
