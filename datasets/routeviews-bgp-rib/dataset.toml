# Machine-readable coordinates for this dataset. The prose companion is README.md,
# which owns provenance, gotchas, and the setup narrative; this file owns only what a
# script needs. Schema: ../SCHEMA.md
schema = 1
id = "routeviews-bgp-rib"
name = "RouteViews BGP RIB (MRT)"
used_by = ["BGP", "TELESCOPE"]
produced_by = "external"
public = true
public_access = true        # [verified 2026-08-27] OSDF director and archive.routeviews.org, both HTTP 200
served_from = "both"
setup = "none"
time_sensitive = "yes"      # the path encodes a YYYY.MM collection month
credentials = []

[access]
transport = "osdf"
base = "https://osdf-director.osg-htc.org"
# `pins` names the placeholders an assignment must supply; see assignments/registry.toml
template = "/routeviews/{collector}/bgpdata/{period}/RIBS"
pins = ["collector", "period"]
python_deps = ["pelicanfs", "pybgpkit-parser"]

# Values the reachability checkers use when no assignment pin is supplied.
[defaults]
collector = "route-views3"
period = "2026.05"

[check]
section = "external"
order = 10
label = "osdf: routeviews rib listing (BGP, TELESCOPE)"
kind = "osdf-listing"
needs_module = "pelicanfs.core"
needs_hint = "pip install pelicanfs"
