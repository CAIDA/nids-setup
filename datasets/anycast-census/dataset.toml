schema = 1
id = "anycast-census"
name = "Anycast Census (LACeS / manycast.net)"
used_by = ["DNS"]
produced_by = "external"
public = true
public_access = true        # [verified 2026-08-27] manycast.net serves the parquet openly, HTTP 200
served_from = "both"
setup = "none"
time_sensitive = "low"      # IPv4-latest, no date in the URL
credentials = []

[access]
transport = "https"
template = "https://manycast.net/api/v1/export/IPv4-latest.parquet"
pins = []

[defaults]

[check]
section = "external"
order = 30
label = "manycast.net: anycast census (DNS)"
# HEAD answers 405 here and Range is ignored on GET, so read just the Parquet magic.
kind = "parquet-magic"
